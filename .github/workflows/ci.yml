name: continuous-integration-checks

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # uv installs via its standalone script and provisions Python itself,
      # avoiding an extra pinned action such as actions/setup-python.
      - name: Install uv
        env:
          UV_VERSION: "0.11.32"  # keep in step with the uv used locally
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh

      - name: Install Dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          # --extra onnx installs the ONNX toolchain. Without it `ty` cannot resolve the
          # onnx imports in s4casting.inference.onnx_export and the export tests skip.
          uv sync --extra onnx

      - name: Check
        run: |
          make check
