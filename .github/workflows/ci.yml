name: continuous-integration-checks

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  python-checks:
    runs-on:
      group: managed-linux
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # uv installs via its standalone script (not a GitHub Action, so exempt
      # from the enterprise SHA-pinning policy) and provisions Python itself,
      # avoiding an extra pinned action such as actions/setup-python.
      - name: Install uv
        run: curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh | sh

      # setup.sh --artifactory re-resolves uv.lock against the internal index;
      # that lockfile must never be committed (public CI has no credentials).
      - name: Check lockfile uses public PyPI
        run: |
          if grep -q 'alliander.jfrog.io' uv.lock; then
            echo "::error file=uv.lock::uv.lock is resolved against Artifactory." \
                 "Restore the public lockfile: git checkout origin/main -- uv.lock"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          uv sync

      - name: Check
        run: |
          make check
