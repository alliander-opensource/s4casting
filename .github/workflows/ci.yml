name: continuous-integration-checks

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The official action is pinned to a commit SHA and verifies the uv binary it
      # installs, unlike piping the standalone install script into a shell.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.32"  # keep in step with the uv used locally

      # The committed lockfile must resolve from public PyPI so builds are
      # publicly reproducible; lockfiles resolved against private mirrors
      # must never be committed.
      - name: Check lockfile uses public PyPI
        run: |
          if grep 'registry = "' uv.lock | grep -qv 'https://pypi.org/simple'; then
            echo "::error file=uv.lock::uv.lock must resolve from public PyPI only." \
                 "Restore it with: git checkout origin/main -- uv.lock"
            exit 1
          fi

      - name: Install Dependencies
        run: |
          uv python install ${{ matrix.python-version }}
          # --extra onnx installs the ONNX toolchain. Without it `ty` cannot resolve the
          # onnx imports in s4casting.inference.onnx_export and the export tests skip.
          # --locked refuses to run unless uv.lock matches pyproject.toml, so only the
          # committed, resolved versions are installed. --no-build is not an option:
          # pykeops and keopscore are published as source distributions only, and the
          # project itself is built from source by poetry-core for the editable install.
          uv sync --extra onnx --locked

      - name: Check
        run: |
          make check
