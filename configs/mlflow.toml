# Example configuration demonstrating MLflow experiment logging.
# Based on cpu.toml so it runs on the public LianderPower dataset.

[machine]
device_kind = "cpu"

[run]
seed = 42069

[logging.mlflow]
# Points at the default local tracking server (`mlflow server`); any endpoint
# accepted by mlflow.set_tracking_uri works here, e.g. a remote HTTP(S)
# tracking server or a managed tracking backend.
uri = "http://127.0.0.1:5000/"
experiment = "dev"

[training]
task = "prediction"
batch_size = 32
gradient_accumulation_steps = 1
evaluation_interval = 1000
checkpoint_interval = 1000
benchmarking_interval = 10_000
maximum_steps = 1_000_000

[model]
context_window = [32]
predict_width = 2
base_sample_interval_minutes = 15
input_sample_intervals_minutes = [15]
output_sample_intervals_minutes = [15]
alignment = 1440
model = "ssm"
norm_clamp = 10

[model.loss]
loss = "nll"
sigma_regularisation_factor = 1

[model.ssm]
kernel = "s4"
n_layers = 9
latent_dim = 1024

[model.output_head]
arch = "gmm"
n_gaussians = 4

[model.patch_encoder]
arch = "linear"
n_layers = 4
patch_size = 8

[model.patch_decoder]
arch = "linear"
patch_size = 8

[benchmarking]
eval_quantiles = [0.01, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95, 0.99]

[optimizer]
learning_rate = 3e-5
weight_decay = 0
gradient_clipping = 1

[io]
feature_order = ["measurements_cdb", "weather"]
output = "out/"

[io.features.measurements_cdb]
location = "data/LianderPower/"
loader = "croissant"

[io.features.weather]
location = "data/LianderPower/"
loader = "croissant"
nearest_neighbor = true
n_features = 4
subset_features = [
    "temperature_2m",
    "wind_speed_100m",
    "shortwave_radiation",
    "direct_normal_irradiance"
]
