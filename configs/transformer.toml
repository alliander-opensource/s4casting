[machine]
device_kind = "cuda"

[run]
seed=42069

[training]
task="cpm"
precision = "bf16"
covariate_dropout = true
covariate_horizon_dropout_p=0.3
batch_size = 16
gradient_accumulation_steps = 1
evaluation_interval = 10_000
checkpoint_interval = 10_000
benchmarking_interval = 10_000
maximum_steps = 2_000_000

[training.cpm]
p_max = 0.25
continuous_max_days= 2
min_context_days = 2
apply_to_validation = false

[model]
context_window = [21, 32, 64, 128, 256, 364, 448, 512]
predict_width = [0.05, 0.3]
base_sample_interval_minutes = 15
input_sample_intervals_minutes = [10, 15, 30, 60, 1440, 10080]
output_sample_intervals_minutes = [10, 15, 30, 60, 1440, 10080]
alignment = 1440
model = "transformer"
norm_clamp = 10
norm_eps = 0.0001

[model.loss]
loss = "nll"
alpha_clip = 0.1
mask_mode = "masked"
sigma_regularisation_factor = 0

[model.transformer]
latent_dim = 512
n_heads = 8
n_layers = 6
dropout = 0
attn_bias = true
mlp_layers = 2
causal = true

[model.output_head]
arch = "gmm"
n_gaussians = 4
quantile_values = [0.01, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95, 0.99]

[model.patch_encoder]
arch = "linear"
n_layers = 4
patch_size = 8

[model.patch_decoder]
arch = "linear"
patch_size = 8 #hour resolution; 1 month patch

[benchmarking]
eval_quantiles = [0.01, 0.05, 0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95, 0.99]
batch_size = 64

[benchmarking.benchmarks.StefBeamBenchmark]
targets_file = "liander2024_targets.yaml"
context_window_days=32
predict_window_days=2
input_sample_interval_minutes=15

[benchmarking.benchmarks.FevBenchBenchmark]
model_name = "s4casting-transformer-gmm"
datasets_prefix = "data/fev_datasets/"
task_subset = "energy"
max_context_samples = 8192

[optimizer]
learning_rate = 3e-5
weight_decay = 0
gradient_clipping = 1

[io]
# gefcom2017, sdwpf (= KDD Cup 2022) and opsd_time_series are deliberately absent: they are test data
# in the fev-bench energy tasks (proenfo_gfc17, kdd_cup_2022_*, entsoe_*).
feature_order = [
    "measurements_cdb",
    "measurements_ampds2",
    "measurements_bdg2",
    "measurements_beberibe",
    "measurements_caiso_renewable",
    "measurements_ckw",
    "measurements_ckw_b",
    "measurements_cossmic",
    "measurements_entsoe_wind_units",
    "measurements_estonia_residential_pv_1min",
    "measurements_floating_solar_pv",
    "measurements_fuhrlander",
    "measurements_haute_borne",
    "measurements_kansai_td_demand",
    "measurements_maelstrom",
    "measurements_nged_substation_loading",
    "measurements_penmanshiel",
    "measurements_ptprosumer_1min",
    "measurements_singapore_ema_halfhourly",
    "measurements_skippd_stanford_pv",
    "measurements_suzhou_industrial_park",
    "measurements_taipower_units",
    "measurements_tepco_demand",
    "measurements_usp_swt",
    "measurements_vestas_v100",
    "measurements_vestas_v52",
    "weather",
    "time",
]
output = "out/"

[io.interval_context_limits]
10 = { min_days = 7, max_days = 56 }
15 = { min_days = 11, max_days = 85 }
30 = { min_days = 16, max_days = 170 }
60 = { min_days = 16, max_days = 365 }
1440 = { min_days = 112, max_days = 1792 }
10080 = { min_days = 224, max_days = 1792 }

