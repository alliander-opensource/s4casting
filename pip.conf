# Template pip configuration for the Alliander Artifactory package index.
# Do not put real credentials here: setup_pip.sh substitutes the placeholders
# from .env and writes the result to pip.conf.local (gitignored).
[global]
index-url = https://<AL_NUMBER>:<ARTIFACTORY_TOKEN>@alliander.jfrog.io/artifactory/api/pypi/pypi-all/simple
